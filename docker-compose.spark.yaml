# Q4 — Spark Standalone 클러스터 (master 1 + worker 2)
# 실행: docker compose -f docker-compose.spark.yaml up -d
services:
  spark-master:
    image: apache/spark:3.5.3
    container_name: spark-master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "7077:7077"   # 잡 제출 포트
      - "8081:8080"   # master Web UI (호스트 8081 -> 컨테이너 8080)
    volumes:
      - ./jobs:/opt/jobs        # 잡 스크립트
      - ./data:/opt/data        # 입력 파일 (wordcount.txt, data.csv)
      - ./output:/opt/output    # 결과 출력
    networks:
      - week7-net

  spark-worker-1:
    image: apache/spark:3.5.3
    container_name: spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "--cores", "1", "--memory", "1g", "--webui-port", "8080",
              "spark://spark-master:7077"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "8082:8080"   # worker-1 Web UI
    volumes:
      - ./jobs:/opt/jobs
      - ./data:/opt/data
      - ./output:/opt/output
    networks:
      - week7-net

  spark-worker-2:
    image: apache/spark:3.5.3
    container_name: spark-worker-2
    hostname: spark-worker-2
    depends_on:
      - spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "--cores", "1", "--memory", "1g", "--webui-port", "8080",
              "spark://spark-master:7077"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "8083:8080"   # worker-2 Web UI
    volumes:
      - ./jobs:/opt/jobs
      - ./data:/opt/data
      - ./output:/opt/output
    networks:
      - week7-net

networks:
  week7-net:
    name: week7-net
